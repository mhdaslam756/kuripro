<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KuriPro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" id="theme-color" content="#f8f9fc" />
    <title>KuriPro</title>
    <style>
      /* Boot loading: a thin progress bar. The splash image is added by the script below, only on the
         first launch of the installed app. */
      #boot-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; overflow: hidden; z-index: 9999; background: rgba(124, 58, 237, 0.15); }
      #boot-bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #7c3aed, #a78bfa); animation: boot-progress 1.1s ease-in-out infinite; }
      @keyframes boot-progress { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      html[data-first-run] #boot-bar { display: none; }
      #boot-phone { position: fixed; inset: 0; z-index: 9999; width: 100%; height: 100%; object-fit: cover; object-position: center; background: #3029c7; }
    </style>
  </head>
  <body style="margin: 0; background: #f8f9fc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="root">
      <div id="boot-bar" role="progressbar" aria-label="Loading"></div>
    </div>
    <script>
      // First launch of the installed phone app only: show the splash image once, then never again.
      (function () {
        try {
          var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
          var phone = window.matchMedia("(max-width: 639px)").matches;
          if (!standalone || !phone || localStorage.getItem("kuripro_splash_seen")) return;
          localStorage.setItem("kuripro_splash_seen", "1");
          document.documentElement.setAttribute("data-first-run", "1");
          var img = document.createElement("img");
          img.id = "boot-phone";
          img.src = "/home.webp";
          img.alt = "";
          img.setAttribute("fetchpriority", "high");
          document.getElementById("root").appendChild(img);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body> 
</html>
